# Nginx Configuration for 智遇 Recruiting Platform
# 放置: sudo cp nginx.conf /etc/nginx/sites-available/zhiyu
# 测试: nginx -t  重载: nginx -s reload

server {
    listen 80;
    server_name 159.75.132.75;
    server_tokens off;

    root /opt/zhiyu-recruiting/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;

    # ─── SEO 文件精确匹配（在 SPA fallback 之前）───
    location = /robots.txt {
        alias /opt/zhiyu-recruiting/dist/robots.txt;
    }
    location = /sitemap.xml {
        alias /opt/zhiyu-recruiting/dist/sitemap.xml;
    }

    # ─── API 反向代理 → Node.js AI 服务器 (端口 8787) ───
    location /api/ai/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # SSE 流式响应支持
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── SPA 静态文件 ───
    location / {
        root /opt/zhiyu-recruiting/dist;
        try_files $uri $uri/ /index.html;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
